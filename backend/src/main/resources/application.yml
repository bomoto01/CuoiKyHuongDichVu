server:
  port: 8080

spring:
  application:
    name: haui-library-management
  profiles:
    active: supabase
  jpa:
    open-in-view: false

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:haui_library;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# Cau hinh su dung Supabase (PostgreSQL Cloud) - Project: yphylldavdpxisddudbr
spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    url: jdbc:postgresql://db.yphylldavdpxisddudbr.supabase.co:5432/postgres?sslmode=require
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: YOUR_SUPABASE_PASSWORD_HERE
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

---
# Cau hinh su dung SQL Server neu muon ket noi SQL Server that
spring:
  config:
    activate:
      on-profile: sqlserver
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=QLThuVienHaUI;encrypt=false;trustServerCertificate=true
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: sa
    password: YourPassword123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

---
jwt:
  signerKey: "389274982374982374982374982734982734982374982374982374982374982374"
  validDuration: 86400 # 1 day in seconds
  refreshableDuration: 604800 # 7 days in seconds

app:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "http://localhost:4173"
      - "http://127.0.0.1:3000"
      - "http://127.0.0.1:5173"

